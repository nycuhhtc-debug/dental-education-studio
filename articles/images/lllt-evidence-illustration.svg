<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">低能量雷射，實證看用途</title><desc id="desc">未對著病人的光源概念圖；區分特定癌症療程相關口腔黏膜炎預防的指引支持，以及其他牙科用途需分別評估的證據，非照射部位或操作示範。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">低能量雷射，實證看用途</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">不能把一種疾病的研究結果，套用到所有牙科問題。</text><rect x="104" y="191" width="324" height="240" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><rect x="148" y="251" width="110" height="50" rx="14" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M258 262h25v28h-25M289 260l34-19m-34 35h47m-47 13 34 19" fill="none" stroke="#0b8f93" stroke-width="5" stroke-linecap="round"/><text x="266" y="364" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">光生物調節（PBM）</text><text x="266" y="401" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">光源概念，非操作示範</text><text x="476" y="230" font-size="27" fill="#17354a" text-anchor="start" font-weight="700">有指引支持的特定用途</text><text x="476" y="278" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">部分癌症療程相關</text><text x="476" y="314" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">口腔黏膜炎的預防</text><text x="476" y="371" font-size="27" fill="#17354a" text-anchor="start" font-weight="700">其他牙科用途</text><text x="476" y="409" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">證據需分別評估</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">適用族群要確認</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">療程條件要核對</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">不保證長期療效</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>