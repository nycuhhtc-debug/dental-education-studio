<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">智齒不痛，也需要評估嗎？</title><desc id="desc">放大鏡中的牙齒，搭配清潔與蛀牙、牙周與鄰牙、必要影像三項評估；不代表每顆智齒都必須拔除。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">智齒不痛，也需要評估嗎？</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">是否拔除，不能只用「有沒有痛」判斷。</text><g transform="translate(270 290) scale(1.25)"><circle cx="0" cy="0" r="59" fill="#f8fbfa" stroke="#0b8f93" stroke-width="6"/><path d="M43 43l46 46" stroke="#17354a" stroke-width="12" stroke-linecap="round"/><g transform="translate(0 0) scale(0.5)"><path d="M-6-60C-28-80-66-65-60-30c4 28 15 35 19 65 3 28 8 42 17 42 14 0 8-56 24-56s10 56 24 56c9 0 14-14 17-42 4-30 15-37 19-65 6-35-32-50-54-30-4 3-8 3-12 0z" fill="white" stroke="#0b8f93" stroke-width="5" stroke-linejoin="round"/></g></g><text x="270" y="420" font-size="28" fill="#17354a" text-anchor="middle" font-weight="700">先檢查，再決定</text><rect x="486" y="204" width="372" height="222" rx="22" fill="#f8fbfa" stroke="#dce9e7"/><circle cx="523" cy="245" r="7" fill="#0b8f93"/><text x="550" y="254" font-size="27" fill="#17354a" text-anchor="start" font-weight="400">清潔與蛀牙情況</text><circle cx="523" cy="310" r="7" fill="#0b8f93"/><text x="550" y="319" font-size="27" fill="#17354a" text-anchor="start" font-weight="400">牙周與鄰牙狀態</text><circle cx="523" cy="375" r="7" fill="#0b8f93"/><text x="550" y="384" font-size="27" fill="#17354a" text-anchor="start" font-weight="400">必要的影像評估</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">清潔狀況</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">鄰牙影響</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">醫師評估</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>