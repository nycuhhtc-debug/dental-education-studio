<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">植牙前，需要評估哪些事？</title><desc id="desc">簡化的牙冠與螺紋植體概念圖，提醒植牙前評估骨量、牙周、健康、咬合與長期維護；非手術位置或比例教學。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">植牙前，需要評估哪些事？</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">治療步驟與時間，依個別狀況安排。</text><rect x="104" y="191" width="324" height="240" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><path d="M188 275v-35q0-28 28-28h70q28 0 28 28v35z" fill="white" stroke="#0b8f93" stroke-width="5"/><rect x="235" y="275" width="32" height="25" rx="4" fill="#e9f6f3" stroke="#0b8f93" stroke-width="4"/><path d="M229 300h44l-7 90h-30z" fill="#e9f6f3" stroke="#0b8f93" stroke-width="5"/><path d="M226 314h50" stroke="#0b8f93" stroke-width="4"/><path d="M226 328h50" stroke="#0b8f93" stroke-width="4"/><path d="M226 342h50" stroke="#0b8f93" stroke-width="4"/><path d="M226 356h50" stroke="#0b8f93" stroke-width="4"/><path d="M226 370h50" stroke="#0b8f93" stroke-width="4"/><text x="337" y="252" font-size="23" fill="#17354a" text-anchor="start" font-weight="400">牙冠</text><text x="337" y="354" font-size="23" fill="#17354a" text-anchor="start" font-weight="400">植體</text><text x="510" y="238" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">骨量與牙周</text><text x="510" y="296" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">健康狀況與咬合</text><text x="510" y="354" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">後續清潔與追蹤</text><text x="510" y="406" font-size="22" fill="#607786" text-anchor="start" font-weight="400">植牙構造為簡化示意</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">骨量與牙周</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">整體健康</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">長期維護</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>