<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">顎骨骨折後，飲食如何進階？</title><desc id="desc">飲食、回診及檢查符號，提醒顎骨骨折後依固定方式、穩定性、咬合與醫師評估選擇飲食；不以週數或能否張口決定正常咀嚼。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">顎骨骨折後，飲食如何進階？</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">能張口 ≠ 能吃軟食 ≠ 能正常咀嚼</text><rect x="94" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(206 300) scale(0.85)"><path d="M-72 0Q-54 70 0 70T72 0Z" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-77 0H77M-23 78h46" stroke="#0b8f93" stroke-width="5" stroke-linecap="round"/></g><text x="206" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">目前能吃的質地</text><rect x="368" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(480 300) scale(0.85)"><rect x="-65" y="-65" width="130" height="132" rx="16" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-65-25H65M-32-77v24m64-24v24" stroke="#0b8f93" stroke-width="6" stroke-linecap="round"/><path d="M-28 17l20 20 42-43" fill="none" stroke="#0b8f93" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="480" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">回診評估癒合</text><rect x="642" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(754 300) scale(0.85)"><circle cx="0" cy="0" r="59" fill="#f8fbfa" stroke="#0b8f93" stroke-width="6"/><path d="M43 43l46 46" stroke="#17354a" stroke-width="12" stroke-linecap="round"/><g transform="translate(0 0) scale(0.5)"><path d="M-6-60C-28-80-66-65-60-30c4 28 15 35 19 65 3 28 8 42 17 42 14 0 8-56 24-56s10 56 24 56c9 0 14-14 17-42 4-30 15-37 19-65 6-35-32-50-54-30-4 3-8 3-12 0z" fill="white" stroke="#0b8f93" stroke-width="5" stroke-linejoin="round"/></g></g><text x="754" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">確認固定與咬合</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">依固定方式</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">依骨折穩定性</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">依醫師評估</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>