<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">張口疼痛或有聲音，怎麼辦？</title><desc id="desc">以簡化鉸鏈和肌肉符號表達關節與咀嚼肌，並非精確解剖圖；持續疼痛或張口受限時需專業評估，聲響不代表同一種疾病。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">張口疼痛或有聲音，怎麼辦？</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">症狀可能涉及咀嚼肌、顳顎關節或其他原因。</text><rect x="104" y="191" width="324" height="240" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><path d="M177 248h125m-100 22v52q0 56 56 56h66" fill="none" stroke="#0b8f93" stroke-width="15" stroke-linecap="round"/><circle cx="202" cy="267" r="22" fill="white" stroke="#17354a" stroke-width="5"/><ellipse cx="267" cy="312" rx="21" ry="43" transform="rotate(-25 267 312)" fill="#e9f6f3" stroke="#0b8f93" stroke-width="4"/><text x="165" y="410" font-size="23" fill="#607786" text-anchor="start" font-weight="400">關節與肌肉概念圖</text><text x="495" y="240" font-size="26" fill="#17354a" text-anchor="start" font-weight="700">疼痛、聲響不一定同原因</text><text x="495" y="301" font-size="27" fill="#17354a" text-anchor="start" font-weight="400">持續疼痛或張口受限</text><text x="495" y="344" font-size="27" fill="#17354a" text-anchor="start" font-weight="400">應接受專業評估</text><text x="495" y="404" font-size="24" fill="#607786" text-anchor="start" font-weight="400">不憑網路資訊自行診斷</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">留意持續疼痛</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">留意張口受限</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">接受個別評估</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>