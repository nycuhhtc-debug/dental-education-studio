<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">拔牙後，保護傷口與血塊</title><desc id="desc">紗布、軟質餐與牙刷三個符號，說明拔牙後依指示止血、飲食及清潔；避免用力漱口、吸吮或吐口水，依醫囑回診。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">拔牙後，保護傷口與血塊</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">不反覆碰觸傷口；出血或腫痛異常時聯絡診所。</text><rect x="94" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(206 300) scale(0.85)"><rect x="-65" y="-55" width="130" height="110" rx="10" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-40-40v80M-50 -40H50" stroke="#dce9e7" stroke-width="3"/><path d="M-20-40v80M-50 -20H50" stroke="#dce9e7" stroke-width="3"/><path d="M0-40v80M-50 0H50" stroke="#dce9e7" stroke-width="3"/><path d="M20-40v80M-50 20H50" stroke="#dce9e7" stroke-width="3"/><path d="M40-40v80M-50 40H50" stroke="#dce9e7" stroke-width="3"/></g><text x="206" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">依指示咬紗布</text><rect x="368" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(480 300) scale(0.85)"><path d="M-72 0Q-54 70 0 70T72 0Z" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-77 0H77M-23 78h46" stroke="#0b8f93" stroke-width="5" stroke-linecap="round"/></g><text x="480" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">溫涼軟質飲食</text><rect x="642" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(754 300) scale(0.85)"><path d="M-75 15H24a15 15 0 010 30H-75a15 15 0 010-30Z" fill="white" stroke="#0b8f93" stroke-width="5"/><rect x="15" y="-15" width="72" height="55" rx="10" fill="#e9f6f3" stroke="#0b8f93" stroke-width="5"/><path d="M27-12v31m16-31v31m16-31v31m16-31v31" stroke="#0b8f93" stroke-width="4"/></g><text x="754" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">維持輕柔清潔</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">避免用力漱口</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">避免吸吮吐口水</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">依醫囑回診</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>