<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1500" viewBox="0 0 840 1500" role="img" aria-labelledby="title desc">
<title id="title">顎骨骨折後，飲食如何進階？</title>
<desc id="desc">衛教示意圖。固定式顎間固定、橡皮筋及拆除固定，不代表特定飲食階段；飲食須由醫師依骨折類型、固定穩定性、咬合與癒合評估。能張口、能吃軟食與能正常咀嚼並不相同。</desc>
<defs><style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;fill:#17354a}.h{font-size:30px;font-weight:700}.body{font-size:26px}.small{font-size:23px;fill:#607786}.sea{fill:#0b8f93}.label{font-size:25px;font-weight:700}</style></defs>
<rect width="840" height="1500" fill="#f8fbfa"/>
<rect x="40" y="36" width="170" height="42" rx="21" fill="#e9f6f3"/>
<text x="125" y="65" text-anchor="middle" font-size="23" class="sea">衛教示意圖</text>
<text x="40" y="132" font-size="38" font-weight="700">顎骨骨折後，飲食如何進階？</text>
<text x="40" y="178" class="body" fill="#607786">看固定與癒合情況，不只看術後週數。</text>
<rect x="40" y="213" width="760" height="126" rx="16" fill="#e9f6f3"/>
<text x="420" y="265" text-anchor="middle" class="h sea">能張口 ≠ 能吃軟食</text>
<text x="420" y="308" text-anchor="middle" class="h sea">≠ 能正常咀嚼</text>
<rect x="40" y="365" width="760" height="190" rx="16" fill="white" stroke="#dce9e7"/>
<text x="66" y="411" class="h">① 先確認目前固定方式</text>
<text x="66" y="460" class="body">固定式 IMF（顎間固定）／橡皮筋／已拆除固定</text>
<text x="66" y="501" class="small">這些是不同狀態，不代表固定的飲食順序。</text>
<text x="66" y="535" class="small">橡皮筋能否取下進食，須依個別醫囑。</text>
<path d="M420 568v25m-10-10 10 10 10-10" fill="none" stroke="#0b8f93" stroke-width="4"/>
<rect x="40" y="610" width="760" height="185" rx="16" fill="white" stroke="#dce9e7"/>
<text x="66" y="656" class="h">② 由醫師評估能否調整飲食</text>
<text x="66" y="705" class="body">骨折部位與類型・治療方式・固定穩定性</text>
<text x="66" y="748" class="body">咬合・癒合情況・必要的影像檢查</text>
<text x="66" y="781" class="small">有骨板或拆除固定，也不等於已能正常咀嚼。</text>
<path d="M420 808v25m-10-10 10 10 10-10" fill="none" stroke="#0b8f93" stroke-width="4"/>
<rect x="40" y="850" width="760" height="425" rx="16" fill="white" stroke="#dce9e7"/>
<text x="66" y="896" class="h">③ 依醫囑選擇飲食質地</text>
<text x="66" y="935" class="small">以下為可能的進階方向，每一步皆須經許可。</text>
<g transform="translate(70 966)"><path d="M0 0h38l-4 36H4zM38 5h9q15 12-9 21" fill="none" stroke="#0b8f93" stroke-width="3"/><text x="70" y="27" class="label">流質</text><text x="224" y="27" class="small">打勻，必要時過濾</text></g>
<text x="154" y="1033" font-size="25" class="sea">↓</text>
<g transform="translate(70 1044)"><path d="M0 7q22 37 44 0zM3 6h38" fill="none" stroke="#0b8f93" stroke-width="3"/><text x="70" y="27" class="label">泥狀</text><text x="224" y="27" class="small">質地均勻、不需咀嚼</text></g>
<text x="154" y="1111" font-size="25" class="sea">↓</text>
<text x="140" y="1149" class="label">不需咀嚼的軟食</text>
<text x="154" y="1187" font-size="25" class="sea">↓</text>
<text x="140" y="1225" class="label">逐步恢復咀嚼</text>
<text x="66" y="1258" class="small">並非人人依相同順序或速度進階。</text>
<rect x="40" y="1300" width="760" height="128" rx="16" fill="#e9f6f3"/>
<text x="66" y="1340" class="label">軟，不代表可以咬。</text>
<text x="66" y="1378" class="small">粥、麵、碎肉仍需看顆粒、質地及允許的咀嚼程度。</text>
<text x="66" y="1412" class="small">不要自行試咬硬物或搖動下顎測試癒合。</text>
<text x="420" y="1470" text-anchor="middle" font-size="22" fill="#607786">衛教示意圖｜不能取代治療團隊的個別指示</text>
</svg>
