<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">張口不適，先評估原因</title><desc id="desc">症狀不一定同原因：疼痛與聲響可能涉及，咀嚼肌、關節或其他原因；留意影響生活的變化：持續疼痛或張口受限，咬合突然改變應就醫；依診斷選擇處理方式：不憑網路資訊自行診斷，由醫師評估治療選擇。概念示意，非個別診斷或操作教學。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="640" height="1000" rx="24" fill="#f8fbfa"/><text x="40" y="78" font-size="34" fill="#17354a" text-anchor="start" font-weight="700">張口不適，先評估原因</text><text x="40" y="125" font-size="27" fill="#607786" text-anchor="start" font-weight="400">病人與家屬的衛教重點</text><rect x="28" y="166" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 264) scale(0.7)"><circle cx="0" cy="0" r="59" fill="#f8fbfa" stroke="#0b8f93" stroke-width="6"/><path d="M43 43l46 46" stroke="#17354a" stroke-width="12" stroke-linecap="round"/><g transform="translate(0 0) scale(0.5)"><path d="M-6-60C-28-80-66-65-60-30c4 28 15 35 19 65 3 28 8 42 17 42 14 0 8-56 24-56s10 56 24 56c9 0 14-14 17-42 4-30 15-37 19-65 6-35-32-50-54-30-4 3-8 3-12 0z" fill="white" stroke="#0b8f93" stroke-width="5" stroke-linejoin="round"/></g></g><text x="205" y="222" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">症狀不一定同原因</text><text x="205" y="271" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">疼痛與聲響可能涉及</text><text x="205" y="315" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">咀嚼肌、關節或其他原因</text><rect x="28" y="386" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 484) scale(0.7)"><path d="M-6-60C-28-80-66-65-60-30c4 28 15 35 19 65 3 28 8 42 17 42 14 0 8-56 24-56s10 56 24 56c9 0 14-14 17-42 4-30 15-37 19-65 6-35-32-50-54-30-4 3-8 3-12 0z" fill="white" stroke="#0b8f93" stroke-width="5" stroke-linejoin="round"/></g><text x="205" y="442" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">留意影響生活的變化</text><text x="205" y="491" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">持續疼痛或張口受限</text><text x="205" y="535" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">咬合突然改變應就醫</text><rect x="28" y="606" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 704) scale(0.7)"><rect x="-65" y="-65" width="130" height="132" rx="16" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-65-25H65M-32-77v24m64-24v24" stroke="#0b8f93" stroke-width="6" stroke-linecap="round"/><path d="M-28 17l20 20 42-43" fill="none" stroke="#0b8f93" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="205" y="662" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">依診斷選擇處理方式</text><text x="205" y="711" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">不憑網路資訊自行診斷</text><text x="205" y="755" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">由醫師評估治療選擇</text><rect x="28" y="852" width="584" height="104" rx="20" fill="#e9f6f3"/><text x="320" y="895" font-size="29" fill="#0b8f93" text-anchor="middle" font-weight="700">實際處置以醫師個別評估為準</text><text x="320" y="934" font-size="24" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學</text></g></svg>