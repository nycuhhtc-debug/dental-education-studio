<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">拔智齒後，傷口怎麼照護？</title><desc id="desc">冰袋、餐碗與回診日曆三個符號，提醒拔智齒後冰敷需依醫囑、保護傷口及留意警訊，不提供固定冰敷時間或操作步驟。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="960" height="600" rx="24" fill="#f8fbfa"/><rect x="28" y="28" width="904" height="544" rx="24" fill="white" stroke="#dce9e7"/><text x="62" y="89" font-size="40" fill="#17354a" text-anchor="start" font-weight="700">拔智齒後，傷口怎麼照護？</text><text x="62" y="135" font-size="25" fill="#607786" text-anchor="start" font-weight="400">保護傷口，依指示止血、清潔與用藥。</text><rect x="94" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(206 300) scale(0.85)"><rect x="-65" y="-40" width="130" height="105" rx="23" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-26-40v-26h52v26" fill="#e9f6f3" stroke="#0b8f93" stroke-width="5"/><g stroke="#0b8f93" stroke-width="4" stroke-linecap="round"><path d="M0-17v55M-24-3l48 28M-24 25L24-3"/></g></g><text x="206" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">冰敷方式依醫囑</text><rect x="368" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(480 300) scale(0.85)"><path d="M-72 0Q-54 70 0 70T72 0Z" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-77 0H77M-23 78h46" stroke="#0b8f93" stroke-width="5" stroke-linecap="round"/></g><text x="480" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">選擇合適食物</text><rect x="642" y="200" width="224" height="224" rx="26" fill="#f8fbfa" stroke="#dce9e7"/><g transform="translate(754 300) scale(0.85)"><rect x="-65" y="-65" width="130" height="132" rx="16" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-65-25H65M-32-77v24m64-24v24" stroke="#0b8f93" stroke-width="6" stroke-linecap="round"/><path d="M-28 17l20 20 42-43" fill="none" stroke="#0b8f93" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="754" y="398" font-size="25" fill="#17354a" text-anchor="middle" font-weight="700">留意變化與回診</text><rect x="62" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="196" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">不要碰觸傷口</text><rect x="346" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="480" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">不自行挖取殘渣</text><rect x="630" y="460" width="268" height="58" rx="16" fill="#e9f6f3"/><text x="764" y="498" font-size="24" fill="#0b8f93" text-anchor="middle" font-weight="700">警訊儘速就醫</text><text x="480" y="553" font-size="21" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學｜實際照護依醫囑</text></g></svg>