<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">拔牙後的居家照護</title><desc id="desc">保護傷口血塊：依醫囑咬紗布止血，避免用力漱口與吸吮；飲食與清潔都要顧：先選溫涼軟質食物，其他牙齒仍輕柔刷牙；留意出血與腫痛：持續大量出血或腫痛加劇，應儘快聯絡診所評估。概念示意，非個別診斷或操作教學。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="640" height="1000" rx="24" fill="#f8fbfa"/><text x="40" y="78" font-size="34" fill="#17354a" text-anchor="start" font-weight="700">拔牙後的居家照護</text><text x="40" y="125" font-size="27" fill="#607786" text-anchor="start" font-weight="400">病人與家屬的衛教重點</text><rect x="28" y="166" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 264) scale(0.7)"><rect x="-65" y="-55" width="130" height="110" rx="10" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-40-40v80M-50 -40H50" stroke="#dce9e7" stroke-width="3"/><path d="M-20-40v80M-50 -20H50" stroke="#dce9e7" stroke-width="3"/><path d="M0-40v80M-50 0H50" stroke="#dce9e7" stroke-width="3"/><path d="M20-40v80M-50 20H50" stroke="#dce9e7" stroke-width="3"/><path d="M40-40v80M-50 40H50" stroke="#dce9e7" stroke-width="3"/></g><text x="205" y="222" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">保護傷口血塊</text><text x="205" y="271" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">依醫囑咬紗布止血</text><text x="205" y="315" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">避免用力漱口與吸吮</text><rect x="28" y="386" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 484) scale(0.7)"><path d="M-72 0Q-54 70 0 70T72 0Z" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-77 0H77M-23 78h46" stroke="#0b8f93" stroke-width="5" stroke-linecap="round"/></g><text x="205" y="442" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">飲食與清潔都要顧</text><text x="205" y="491" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">先選溫涼軟質食物</text><text x="205" y="535" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">其他牙齒仍輕柔刷牙</text><rect x="28" y="606" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 704) scale(0.7)"><rect x="-65" y="-65" width="130" height="132" rx="16" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-65-25H65M-32-77v24m64-24v24" stroke="#0b8f93" stroke-width="6" stroke-linecap="round"/><path d="M-28 17l20 20 42-43" fill="none" stroke="#0b8f93" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="205" y="662" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">留意出血與腫痛</text><text x="205" y="711" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">持續大量出血或腫痛加劇</text><text x="205" y="755" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">應儘快聯絡診所評估</text><rect x="28" y="852" width="584" height="104" rx="20" fill="#e9f6f3"/><text x="320" y="895" font-size="29" fill="#0b8f93" text-anchor="middle" font-weight="700">實際處置以醫師個別評估為準</text><text x="320" y="934" font-size="24" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學</text></g></svg>