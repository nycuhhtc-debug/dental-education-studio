<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">植牙手術後的照護</title><desc id="desc">避免傷口受刺激：飲食先選溫涼軟質，避免手術側咀嚼與壓迫；清潔與用藥依醫囑：不拉扯縫線或測試穩固，藥物不自行加量或停用；按時回診，留意警訊：發燒、膿液或腫痛加劇，請立即聯絡診所回診。概念示意，非個別診斷或操作教學。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="640" height="1000" rx="24" fill="#f8fbfa"/><text x="40" y="78" font-size="34" fill="#17354a" text-anchor="start" font-weight="700">植牙手術後的照護</text><text x="40" y="125" font-size="27" fill="#607786" text-anchor="start" font-weight="400">病人與家屬的衛教重點</text><rect x="28" y="166" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 264) scale(0.7)"><path d="M-72 0Q-54 70 0 70T72 0Z" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-77 0H77M-23 78h46" stroke="#0b8f93" stroke-width="5" stroke-linecap="round"/></g><text x="205" y="222" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">避免傷口受刺激</text><text x="205" y="271" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">飲食先選溫涼軟質</text><text x="205" y="315" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">避免手術側咀嚼與壓迫</text><rect x="28" y="386" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 484) scale(0.7)"><path d="M-75 15H24a15 15 0 010 30H-75a15 15 0 010-30Z" fill="white" stroke="#0b8f93" stroke-width="5"/><rect x="15" y="-15" width="72" height="55" rx="10" fill="#e9f6f3" stroke="#0b8f93" stroke-width="5"/><path d="M27-12v31m16-31v31m16-31v31m16-31v31" stroke="#0b8f93" stroke-width="4"/></g><text x="205" y="442" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">清潔與用藥依醫囑</text><text x="205" y="491" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">不拉扯縫線或測試穩固</text><text x="205" y="535" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">藥物不自行加量或停用</text><rect x="28" y="606" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 704) scale(0.7)"><rect x="-65" y="-65" width="130" height="132" rx="16" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-65-25H65M-32-77v24m64-24v24" stroke="#0b8f93" stroke-width="6" stroke-linecap="round"/><path d="M-28 17l20 20 42-43" fill="none" stroke="#0b8f93" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="205" y="662" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">按時回診，留意警訊</text><text x="205" y="711" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">發燒、膿液或腫痛加劇</text><text x="205" y="755" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">請立即聯絡診所回診</text><rect x="28" y="852" width="584" height="104" rx="20" fill="#e9f6f3"/><text x="320" y="895" font-size="29" fill="#0b8f93" text-anchor="middle" font-weight="700">實際處置以醫師個別評估為準</text><text x="320" y="934" font-size="24" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學</text></g></svg>