name: Article and image checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/update_sitemap.py --check
      - run: python3 tools/check_articles.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
