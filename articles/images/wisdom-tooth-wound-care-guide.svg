<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc"><title id="title">拔智齒後的照護提醒</title><desc id="desc">腫痛處理依醫囑：冰敷方式及時間先確認，冰袋不直接接觸皮膚；不要碰觸或挖取傷口：不自行拉扯或拆除縫線，清潔傷口附近依醫囑；異常變化應聯絡診所：大量出血或腫痛加劇，呼吸或吞嚥困難立即就醫。概念示意，非個別診斷或操作教學。</desc><g font-family="Noto Sans CJK TC,Noto Sans TC,system-ui,sans-serif"><rect width="640" height="1000" rx="24" fill="#f8fbfa"/><text x="40" y="78" font-size="34" fill="#17354a" text-anchor="start" font-weight="700">拔智齒後的照護提醒</text><text x="40" y="125" font-size="27" fill="#607786" text-anchor="start" font-weight="400">病人與家屬的衛教重點</text><rect x="28" y="166" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 264) scale(0.7)"><rect x="-65" y="-40" width="130" height="105" rx="23" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-26-40v-26h52v26" fill="#e9f6f3" stroke="#0b8f93" stroke-width="5"/><g stroke="#0b8f93" stroke-width="4" stroke-linecap="round"><path d="M0-17v55M-24-3l48 28M-24 25L24-3"/></g></g><text x="205" y="222" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">腫痛處理依醫囑</text><text x="205" y="271" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">冰敷方式及時間先確認</text><text x="205" y="315" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">冰袋不直接接觸皮膚</text><rect x="28" y="386" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 484) scale(0.7)"><path d="M-75 15H24a15 15 0 010 30H-75a15 15 0 010-30Z" fill="white" stroke="#0b8f93" stroke-width="5"/><rect x="15" y="-15" width="72" height="55" rx="10" fill="#e9f6f3" stroke="#0b8f93" stroke-width="5"/><path d="M27-12v31m16-31v31m16-31v31m16-31v31" stroke="#0b8f93" stroke-width="4"/></g><text x="205" y="442" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">不要碰觸或挖取傷口</text><text x="205" y="491" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">不自行拉扯或拆除縫線</text><text x="205" y="535" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">清潔傷口附近依醫囑</text><rect x="28" y="606" width="584" height="200" rx="20" fill="white" stroke="#dce9e7"/><g transform="translate(110 704) scale(0.7)"><rect x="-65" y="-65" width="130" height="132" rx="16" fill="white" stroke="#0b8f93" stroke-width="5"/><path d="M-65-25H65M-32-77v24m64-24v24" stroke="#0b8f93" stroke-width="6" stroke-linecap="round"/><path d="M-28 17l20 20 42-43" fill="none" stroke="#0b8f93" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="205" y="662" font-size="30" fill="#17354a" text-anchor="start" font-weight="700">異常變化應聯絡診所</text><text x="205" y="711" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">大量出血或腫痛加劇</text><text x="205" y="755" font-size="26" fill="#17354a" text-anchor="start" font-weight="400">呼吸或吞嚥困難立即就醫</text><rect x="28" y="852" width="584" height="104" rx="20" fill="#e9f6f3"/><text x="320" y="895" font-size="29" fill="#0b8f93" text-anchor="middle" font-weight="700">實際處置以醫師個別評估為準</text><text x="320" y="934" font-size="24" fill="#607786" text-anchor="middle" font-weight="400">概念示意，非個別診斷或操作教學</text></g></svg>